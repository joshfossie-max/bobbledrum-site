<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Bobbledrum | Get in Touch</title>

  <meta
    name="description"
    content="Meet Bobbledrum. Currently in development. Questions, ideas, or interest? Get in touch at hello@bobbledrum.com."
  >

  <link rel="canonical" href="https://bobbledrum.com/">

  <style>
    :root {
      color-scheme: dark;
      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      display: grid;
      place-items: center;
      min-height: 100vh;
      min-height: 100svh;
      overflow-x: hidden;
      background:
        radial-gradient(
          circle at 50% 38%,
          rgba(255, 255, 255, 0.08),
          transparent 34rem
        ),
        linear-gradient(145deg, #16181d 0%, #08090b 72%);
      color: #f5f4ef;
    }

    body::before {
      position: fixed;
      inset: 0;
      pointer-events: none;
      content: "";
      opacity: 0.18;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.035) 1px, transparent 1px);
      background-size: 42px 42px;
      mask-image: linear-gradient(to bottom, black, transparent 85%);
    }

    main {
      position: relative;
      z-index: 1;
      width: min(92vw, 760px);
      padding: 48px 24px;
      text-align: center;
      animation: reveal 1s ease-out both;
    }

    .logo-frame {
      width: min(100%, 570px);
      margin: 0 auto 38px;
      padding: clamp(18px, 4vw, 34px);
      border: 1px solid rgba(255, 255, 255, 0.13);
      border-radius: 28px;
      background: #ffffff;
      box-shadow:
        0 30px 80px rgba(0, 0, 0, 0.5),
        0 0 70px rgba(255, 255, 255, 0.06);
      animation: float 5s ease-in-out infinite;
    }

    .logo {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 12px;
    }

    .eyebrow {
      margin: 0 0 14px;
      color: rgba(245, 244, 239, 0.58);
      font-size: 0.74rem;
      font-weight: 700;
      letter-spacing: 0.25em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 700px;
      margin: 0 auto;
      font-size: clamp(2rem, 6vw, 4.3rem);
      font-weight: 650;
      line-height: 1.04;
      letter-spacing: -0.045em;
    }

    h1 span {
      display: block;
      color: rgba(245, 244, 239, 0.58);
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-top: 32px;
      color: rgba(245, 244, 239, 0.72);
      font-size: 0.92rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #f5f4ef;
      box-shadow: 0 0 18px rgba(245, 244, 239, 0.7);
      animation: pulse 2s ease-in-out infinite;
    }

    .intro {
      max-width: 480px;
      margin: 24px auto 0;
      color: #c7c8cd;
      font-size: 1.08rem;
      line-height: 1.65;
    }
    .contact { margin-top: 28px; }
    .contact-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 52px;
      padding: 14px 30px;
      border: 2px solid #f5f4ef;
      border-radius: 999px;
      background: #f5f4ef;
      color: #111318;
      text-decoration: none;
      font-weight: 750;
      transition: transform .2s ease, background .2s ease;
    }
    .contact-button:hover { background: #fff; transform: translateY(-2px); }
    a:focus-visible { outline: 3px solid #91c9ff; outline-offset: 5px; }
    .email { display: block; width: fit-content; margin: 18px auto 0; color: #d8dae1; text-underline-offset: 4px; overflow-wrap: anywhere; }
    footer {
      margin-top: 54px;
      color: rgba(245, 244, 239, 0.34);
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    @keyframes reveal {
      from {
        opacity: 0;
        transform: translateY(18px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes float {
      0%,
      100% {
        transform: translateY(0) rotate(-0.2deg);
      }

      50% {
        transform: translateY(-7px) rotate(0.2deg);
      }
    }

    @keyframes pulse {
      0%,
      100% {
        opacity: 0.35;
        transform: scale(0.85);
      }

      50% {
        opacity: 1;
        transform: scale(1);
      }
    }

    @media (max-width: 520px) {
      main {
        padding: 32px 18px;
      }

      .logo-frame {
        margin-bottom: 30px;
        border-radius: 21px;
      }

      footer {
        margin-top: 42px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>

<body>
  <main>
    <div class="logo-frame">
      <img
        class="logo"
        src="bobbledrum-logo.jpg"
        alt="Bobbledrum"
      >
    </div>

    <p class="eyebrow">The original personalized bobble</p>

    <h1>
      A little bobble.
      <span>A lot of personality.</span>
    </h1>

    <p class="intro">Spotted a Bobbledrum? We&rsquo;d love to hear from you.
      Reach out with questions, ideas, or interest in what comes next.</p>

    <div class="contact">
      <a class="contact-button" href="mailto:hello@bobbledrum.com?subject=Hello%20Bobbledrum">Get in touch <span aria-hidden="true">&nbsp;↗</span></a>
      <a class="email" href="mailto:hello@bobbledrum.com">hello@bobbledrum.com</a>
    </div>

    <div class="status">
      <span class="status-dot" aria-hidden="true"></span>
      Currently in development
    </div>

    <footer>Bobbledrum&trade;</footer>
  </main>
</body>
</html>
